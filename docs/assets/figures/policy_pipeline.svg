<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="750" viewBox="0 0 1600 750" role="img" aria-label="ChicGrasp perception to action pipeline"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#067c78"/></marker></defs><rect width="1600" height="750" fill="#f6f4ef"/><g font-family="DejaVu Sans, sans-serif" fill="#142b36"><text x="70" y="90" font-size="40" font-weight="700">See. Denoise. Act. Observe again.</text><text x="70" y="135" font-size="21" fill="#566874">ChicGrasp joins Cartesian motion and independent jaw control in one policy.</text><rect x="70" y="225" width="330" height="230" rx="18" fill="#fff" stroke="#dde3df"/><text x="95" y="270" font-size="21" fill="#067c78" font-weight="700">01  OBSERVE</text><text x="95" y="327" font-size="19">Three RGB camera views</text><text x="95" y="366" font-size="19">End-effector pose</text><text x="95" y="405" font-size="19">Left + right jaw states</text><rect x="450" y="225" width="330" height="230" rx="18" fill="#fff" stroke="#dde3df"/><text x="475" y="270" font-size="21" fill="#067c78" font-weight="700">02  GENERATE</text><text x="475" y="327" font-size="19">Encode observation history</text><text x="475" y="366" font-size="19">Iteratively remove noise</text><text x="475" y="405" font-size="19">Predict an action sequence</text><rect x="830" y="225" width="330" height="230" rx="18" fill="#fff" stroke="#dde3df"/><text x="855" y="270" font-size="21" fill="#067c78" font-weight="700">03  COMMAND</text><text x="855" y="327" font-size="19">Robot: Cartesian pose targets</text><text x="855" y="366" font-size="19">Gripper: left / right jaw bits</text><text x="855" y="405" font-size="19">Execute a short prefix</text><path d="M410,340 h30" stroke="#067c78" stroke-width="3" marker-end="url(#arrow)"/><path d="M790,340 h30" stroke="#067c78" stroke-width="3" marker-end="url(#arrow)"/><path d="M995,470 V525 H235 V470" stroke="#067c78" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="447" y="565" font-size="20" fill="#067c78">Receding horizon: update the plan with new observations</text><path d="M1170,340 h45" stroke="#cb792f" stroke-width="3"/><rect x="1230" y="225" width="300" height="230" rx="18" fill="#efe5d7"/><text x="1255" y="270" font-size="21" font-weight="700">SCRIPTED REHANG</text><text x="1255" y="327" font-size="19">A fixed waypoint sequence</text><text x="1255" y="366" font-size="19">completes the transfer.</text><text x="1255" y="415" font-size="17" fill="#566874">Separate from policy inference</text><text x="70" y="649" font-size="19">Task commands: [x, y, z, left jaw, right jaw]. Stored tensor: [x, y, z, rx, ry, rz, left jaw, right jaw].</text><text x="70" y="691" font-size="17" fill="#566874">Source: archived checkpoint configuration and ChicGrasp implementation; published study: DOI 10.1002/adrr.202500149.</text></g></svg>